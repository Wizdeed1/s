<script id="themeBoot">
/* Light or dark before the first paint, in plain old JavaScript like the start guard: the choice kept in this browser (System,
   Light or Dark, in the account menu and Settings; System, the first choice, follows the computer) sets data-theme on the page.
   Less transparency (mc-glass: 'solid' here, or the computer's own reduced-transparency setting) sets data-glass="solid". */
(function () {
  var t = 'system', dark = false;
  try { t = localStorage.getItem('mc-theme') || 'system'; } catch (e) { /* this browser only */ }
  try { dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { dark = t === 'dark'; }
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var g = '';
  try { g = localStorage.getItem('mc-glass') || ''; } catch (e) { /* this browser only */ }
  try { if (g === 'solid' || (g !== 'glass' && window.matchMedia('(prefers-reduced-transparency: reduce)').matches)) document.documentElement.setAttribute('data-glass', 'solid'); } catch (e) { if (g === 'solid') document.documentElement.setAttribute('data-glass', 'solid'); }
})();
</script>
